name: Lab Operations Tests

on:
  push:
    branches: [dev, integration, main]
    paths:
      - 'workloads/webapp/**'
      - 'workloads/webapp.Tests/**'
      - 'scripts/invoke-lab-operation.ps1'
      - 'scripts/initialize-webapp-console.ps1'
      - 'scripts/deploy.ps1'
      - 'scripts/deploy-webapp.ps1'
      - 'scripts/post-deploy.ps1'
      - 'scripts/post-staged-deploy.ps1'
      - 'scripts/post-cloud-shell-deploy.ps1'
      - 'scripts/staged-deploy-helpers.ps1'
      - 'scripts/teardown.ps1'
      - 'scripts/remove-lab-entra-identities.ps1'
      - 'scripts/setup-rbac-demo.ps1'
      - 'scripts/wait-webapp-publication.ps1'
      - 'scripts/setup-webapp-agent-access.ps1'
      - 'scripts/tests/console-bootstrap.Tests.ps1'
      - 'scripts/tests/console-deployment.Tests.ps1'
      - 'scripts/tests/ai-traffic.Tests.ps1'
      - 'scripts/tests/staged-guide.Tests.ps1'
      - 'scripts/tests/sli-setup.Tests.ps1'
      - 'scripts/tests/teardown.Tests.ps1'
      - 'scripts/tests/entra-cleanup.Tests.ps1'
      - 'scripts/tests/compiled-templates.Tests.ps1'
      - 'scripts/tests/amba.Tests.ps1'
      - 'scripts/tests/webapp-publication.Tests.ps1'
      - 'scripts/setup-ai.ps1'
      - 'scripts/setup-ai-cloud-shell.ps1'
      - 'scripts/setup-sre-agent.ps1'
      - 'scripts/setup-slis.ps1'
      - 'scripts/setup-health-model.ps1'
      - 'scripts/remove-arm-resource.ps1'
      - 'workloads/ai/*.py'
      - 'workloads/ai/tests/**'
      - 'workloads/operations/**'
      - 'infra/modules/lab-console*'
      - 'infra/modules/appservice*'
      - 'infra/main.*'
      - 'infra/stages/*'
      - 'docs/DEPLOY-*-STEP-BY-STEP.md'
      - 'docs/POST-DEPLOYMENT.md'
      - 'docs/STAGE-AI.md'
      - 'scripts/README.md'
      - 'terraform/**'
      - 'scripts/tests/lab-operations*.Tests.ps1'
      - 'scripts/start-the-lab.ps1'
      - 'scripts/break-the-lab.ps1'
      - 'scripts/restore-the-lab.ps1'
      - 'scripts/start-ramp.ps1'
      - 'scripts/simulate-high-cpu.ps1'
      - 'scripts/send-custom-logs.ps1'
      - 'scripts/send-release-annotation.ps1'
      - '.github/workflows/lab-operations*.yml'
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  verify:
    name: Lab operations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Backend approval and dispatch tests
        run: dotnet test workloads/webapp.Tests/AmlabHello.Tests.csproj -c Release --nologo
      - name: Runner and automatic bootstrap tests
        shell: pwsh
        run: |
          ./scripts/tests/lab-operations.Tests.ps1
          ./scripts/tests/lab-operations-execution.Tests.ps1
          ./scripts/tests/console-bootstrap.Tests.ps1
          ./scripts/tests/console-deployment.Tests.ps1
          ./scripts/tests/webapp-publication.Tests.ps1
          ./scripts/tests/ai-traffic.Tests.ps1
          ./scripts/tests/staged-guide.Tests.ps1
          ./scripts/tests/sli-setup.Tests.ps1
          ./scripts/tests/teardown.Tests.ps1
          ./scripts/tests/entra-cleanup.Tests.ps1
          ./workloads/webapp/tests/webapp-access.Tests.ps1
      - name: Agent provisioning and background traffic without Azure
        run: python -B -m unittest discover -s workloads/ai/tests -p 'test_*.py' -v
      - name: Browser regressions without live integrations
        working-directory: workloads/webapp
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
          npm test

  infrastructure:
    name: Infrastructure validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: '1.15.8'
          terraform_wrapper: false
      - name: Install the pinned Bicep compiler
        run: az bicep install --version v0.37.4
      - name: Verify generated templates and Grafana access
        shell: pwsh
        run: |
          ./scripts/tests/compiled-templates.Tests.ps1
          ./scripts/tests/amba.Tests.ps1
          ./scripts/tests/grafana-access.Tests.ps1
          ./scripts/tests/grafana-config.Tests.ps1
      - name: Validate console completion with mocked Azure providers
        working-directory: terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate -no-color
          terraform test -test-directory=tests -no-color